<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252931" />
      <stop offset="100%" stop-color="#111318" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b8dee" />
      <stop offset="100%" stop-color="#3a6ac8" />
    </linearGradient>
    <linearGradient id="bar-grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ecf8e" />
      <stop offset="100%" stop-color="#2ba46d" />
    </linearGradient>
  </defs>

  <!-- Fondo a sangre completa: cubre TODO el lienzo (sin esquinas transparentes).
       Android lo recorta a la forma del sistema (squircle del Pixel, círculo, etc.) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad)" />

  <!-- Todo el contenido vive dentro de la zona segura (círculo de radio ~205,
       el 80% central) para que ningún recorte del sistema lo corte. -->

  <!-- Etiqueta XML sutil de fondo -->
  <text x="256" y="178" fill="#3d4250" font-family="monospace, sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="4">&lt;/&gt;</text>

  <!-- Ondas de sonido centrales -->
  <rect x="182" y="236" width="34" height="92" rx="17" fill="url(#bar-grad)" />
  <rect x="239" y="190" width="34" height="184" rx="17" fill="url(#bar-grad-green)" />
  <rect x="296" y="244" width="34" height="76" rx="17" fill="url(#bar-grad)" />

  <!-- Texto inferior -->
  <text x="256" y="426" fill="#e8eaf0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="48" text-anchor="middle" letter-spacing="6">SSML</text>
</svg>
